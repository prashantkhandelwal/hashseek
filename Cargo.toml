[package]
name = "hashseek"
version = "0.1.0"
edition = "2024"
description = "Retrieve BitTorrent metadata from an infohash without downloading content"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["bittorrent", "torrent", "infohash", "dht", "magnet"]
categories = ["command-line-utilities", "network-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hashseek"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:size_format"]

[dependencies]
anyhow = "1"
librqbit = "9.0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
clap = { version = "4.6.7", features = ["derive"], optional = true }
size_format = { version = "1", optional = true }
